name: Tests

# No keys, no network: unit tests plus the deterministic mock baseline.
# Fails if the mock run changes any committed results file, which proves the
# quickstart never overwrites the recorded model run in evals/RESULTS.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest -v

      - name: Mock baseline (quickstart)
        run: python3 -m src.run_eval --mock

      - name: Committed results are unchanged
        run: git diff --exit-code -- evals/
